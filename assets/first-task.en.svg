<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1060" viewBox="0 0 1600 1060" role="img">
<title>When an action loses its response</title>
<rect width="1600" height="1060" fill="#f6f7f3"/>
<g font-family="Segoe UI, Microsoft YaHei UI, Yu Gothic UI, sans-serif" fill="#172f32">
<text x="80" y="70" font-size="22" letter-spacing="3">ENTERPRISE BRAIN / DEVELOPER PREVIEW</text>
<text x="80" y="150" font-size="48" font-weight="650">When an action loses its response</text>
<text x="80" y="194" font-size="23" fill="#587071">Observed execution evidence · constructed, owned fixtures</text>
<path d="M80 224H1520" stroke="#b9cac4"/>
<rect x="80" y="251" width="1440" height="114" rx="12" fill="#ffffff" stroke="#dce4df"/>
<text x="112" y="313" font-size="30" fill="#347866">01</text>
<text x="190" y="294" font-size="26" font-weight="600">Read and confirm</text>
<text x="190" y="333" font-size="22" fill="#587071">Two process definitions and one cross-process relationship.</text>
<rect x="80" y="383" width="1440" height="114" rx="12" fill="#ffffff" stroke="#dce4df"/>
<text x="112" y="445" font-size="30" fill="#347866">02</text>
<text x="190" y="426" font-size="26" font-weight="600">Freeze and approve</text>
<text x="190" y="465" font-size="22" fill="#587071">IT self-approval and missing business approval were refused.</text>
<rect x="80" y="515" width="1440" height="114" rx="12" fill="#ffffff" stroke="#dce4df"/>
<text x="112" y="577" font-size="30" fill="#347866">03</text>
<text x="190" y="558" font-size="26" font-weight="600">Commit, then lose the response</text>
<text x="190" y="597" font-size="22" fill="#587071">The source committed; the action remained unknown to the worker.</text>
<rect x="80" y="647" width="1440" height="114" rx="12" fill="#ffffff" stroke="#dce4df"/>
<text x="112" y="709" font-size="30" fill="#347866">04</text>
<text x="190" y="690" font-size="26" font-weight="600">Reopen and reconcile</text>
<text x="190" y="729" font-size="22" fill="#587071">A fresh worker queried original actions and retained their identities.</text>
<rect x="80" y="804" width="460" height="125" rx="12" fill="#e4eee7"/>
<text x="108" y="854" font-size="24">Source records</text>
<text x="108" y="906" font-size="43" font-weight="650">2</text>
<rect x="570" y="804" width="460" height="125" rx="12" fill="#e4eee7"/>
<text x="598" y="854" font-size="24">Receipts</text>
<text x="598" y="906" font-size="43" font-weight="650">2</text>
<rect x="1060" y="804" width="460" height="125" rx="12" fill="#e4eee7"/>
<text x="1088" y="854" font-size="24">Duplicate submissions</text>
<text x="1088" y="906" font-size="43" font-weight="650">0</text>
<text x="80" y="977" font-size="20" fill="#587071">Not a customer deployment, live-model result or production certification.</text>
