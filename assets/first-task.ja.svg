<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1060" viewBox="0 0 1600 1060" role="img">
<title>操作の確定後に応答が失われたら</title>
<rect width="1600" height="1060" fill="#f6f7f3"/>
<g font-family="Segoe UI, Microsoft YaHei UI, Yu Gothic UI, sans-serif" fill="#172f32">
<text x="80" y="70" font-size="22" letter-spacing="3">ENTERPRISE BRAIN / DEVELOPER PREVIEW</text>
<text x="80" y="150" font-size="48" font-weight="650">操作の確定後に応答が失われたら</text>
<text x="80" y="194" font-size="23" fill="#587071">実際の実行結果 · 自ら用意した検証用プロセスとツール</text>
<path d="M80 224H1520" stroke="#b9cac4"/>
<rect x="80" y="251" width="1440" height="114" rx="12" fill="#ffffff" stroke="#dce4df"/>
<text x="112" y="313" font-size="30" fill="#347866">01</text>
<text x="190" y="294" font-size="26" font-weight="600">参照と確認</text>
<text x="190" y="333" font-size="22" fill="#587071">2つのプロセス定義と、1つの依存関係を確認。</text>
<rect x="80" y="383" width="1440" height="114" rx="12" fill="#ffffff" stroke="#dce4df"/>
<text x="112" y="445" font-size="30" fill="#347866">02</text>
<text x="190" y="426" font-size="26" font-weight="600">計画の確定と業務承認</text>
<text x="190" y="465" font-size="22" fill="#587071">ITによる自己承認と、業務承認のない実行を拒否。</text>
<rect x="80" y="515" width="1440" height="114" rx="12" fill="#ffffff" stroke="#dce4df"/>
<text x="112" y="577" font-size="30" fill="#347866">03</text>
<text x="190" y="558" font-size="26" font-weight="600">連携先で確定後に応答を喪失</text>
<text x="190" y="597" font-size="22" fill="#587071">連携先での確定後、ワーカー側は結果不明として保持。</text>
<rect x="80" y="647" width="1440" height="114" rx="12" fill="#ffffff" stroke="#dce4df"/>
<text x="112" y="709" font-size="30" fill="#347866">04</text>
<text x="190" y="690" font-size="26" font-weight="600">再起動後に照合</text>
<text x="190" y="729" font-size="22" fill="#587071">新しいワーカーが元の操作を照会し、IDと計画を保持。</text>
<rect x="80" y="804" width="460" height="125" rx="12" fill="#e4eee7"/>
<text x="108" y="854" font-size="24">連携先の記録</text>
<text x="108" y="906" font-size="43" font-weight="650">2</text>
<rect x="570" y="804" width="460" height="125" rx="12" fill="#e4eee7"/>
<text x="598" y="854" font-size="24">実行証跡</text>
<text x="598" y="906" font-size="43" font-weight="650">2</text>
<rect x="1060" y="804" width="460" height="125" rx="12" fill="#e4eee7"/>
<text x="1088" y="854" font-size="24">重複送信</text>
<text x="1088" y="906" font-size="43" font-weight="650">0</text>
<text x="80" y="977" font-size="20" fill="#587071">顧客への導入、実モデルの評価、本番運用の認証ではありません。</text>
<text x="80" y="1015" font-size="18" fill="#587071">2026-10-25 · Windows x64 / Node 24.19.0 · inventory 57f98fdc01460e09…</text>
</g></svg>
