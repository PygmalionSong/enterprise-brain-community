<text x="682" y="319" font-family="Segoe UI,Arial,sans-serif" font-size="21" fill="#53666d">Materials, commitments and</text>
<text x="682" y="351" font-family="Segoe UI,Arial,sans-serif" font-size="21" fill="#53666d">qualifications</text>
