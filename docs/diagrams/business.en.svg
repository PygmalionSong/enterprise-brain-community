<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1040" viewBox="0 0 1000 1040" role="img"><title>Which teams does a shortage involve?</title><desc>Beverage reference model · Capability groups, with parallel work and feedback</desc><rect width="1000" height="1040" fill="white"/>
