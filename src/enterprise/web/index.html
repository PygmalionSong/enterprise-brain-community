<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Enterprise Brain</title><link rel="stylesheet" href="/enterprise.css"><script type="module" src="/enterprise.js"></script></head>
<body data-page="__ENTERPRISE_PAGE__">
<header><a class="brand" href="/">Enterprise Brain<span data-t="brandCaption">企业经营中枢</span></a><div class="header-actions"><label class="language"><span class="sr-only" data-t="language">语言</span><select id="language"><option value="zh">中文</option><option value="en">English</option><option value="ja">日本語</option></select></label><button id="logout" class="quiet" hidden data-t="logout">退出登录</button></div></header>
<main>
<div id="message" role="status" aria-live="polite" hidden></div>
<section data-view="login" class="login-panel" hidden><div class="eyebrow" data-t="secureAccess">企业专属空间</div><h1 data-t="welcome">欢迎回来</h1><p class="subtle" data-t="loginHint">使用企业账号进入工作区。</p><form id="login-form"><label><span data-t="username">账号</span><input name="username" autocomplete="username" required minlength="3" maxlength="64"></label><label><span data-t="password">密码</span><input name="password" type="password" autocomplete="current-password" required maxlength="72"></label><button class="primary" type="submit" data-t="signIn">登录</button></form></section>
<section data-view="console" hidden><div class="page-heading"><div><div class="eyebrow" data-t="administration">企业管理</div><h1 data-t="accounts">账号与访问权限</h1><p class="subtle" data-t="accountsHint">管理企业账号、访问角色和登录状态。</p></div><span id="account-count" class="count"></span></div>
<div class="panel"><h2 data-t="newAccount">新增账号</h2><form id="create-form" class="create-grid"><label><span data-t="username">账号</span><input name="username" autocomplete="off" required minlength="3" maxlength="64" pattern="[A-Za-z0-9._-]+"></label><label><span data-t="initialPassword">初始密码</span><input name="password" type="password" autocomplete="new-password" required minlength="14" maxlength="72"></label><label><span data-t="role">角色</span><select name="role" id="create-role"><option value="operations" data-role="operations">运营人员</option><option value="executive" data-role="executive">经营负责人</option><option value="auditor" data-role="auditor">审阅人员</option><option value="it" data-role="it">IT人员</option></select></label><button class="primary" type="submit" data-t="addAccount">创建账号</button><label class="checkbox"><input id="create-admin" name="identityAdministrator" type="checkbox" disabled><span data-t="identityAdmin">可管理企业账号</span></label><p class="field-hint" data-t="passwordHint">密码至少14个字符，UTF-8编码不超过72字节。</p></form></div>
<div class="panel account-panel"><div class="table-heading"><h2 data-t="directory">账号目录</h2><button id="refresh" class="quiet" data-t="refresh">刷新</button></div><div class="table-scroll"><table><thead><tr><th data-t="username">账号</th><th data-t="role">角色</th><th data-t="identityAdmin">可管理企业账号</th><th data-t="status">状态</th><th data-t="actions">操作</th></tr></thead><tbody id="account-rows"></tbody></table></div></div></section>
<section data-view="workspace" class="workspace-panel" hidden><div class="eyebrow" data-t="workspace">企业工作区</div><h1 data-t="connectedAccount">账号已就绪</h1><p class="subtle" data-t="workspaceHint">业务工作区尚未配置。请联系企业管理员完成配置后继续。</p></section>
</main>
<dialog id="password-dialog"><form id="password-form"><div class="eyebrow" id="password-target"></div><h2 data-t="resetPassword">重置密码</h2><p id="password-message" role="alert" hidden></p><label><span data-t="newPassword">新密码</span><input name="password" type="password" autocomplete="new-password" required minlength="14" maxlength="72"></label><label><span data-t="confirmPassword">确认新密码</span><input name="confirmation" type="password" autocomplete="new-password" required minlength="14" maxlength="72"></label><p class="subtle" data-t="resetHint">重置后，该账号的现有登录会话将失效。</p><div class="dialog-actions"><button type="button" id="cancel-password" class="quiet" data-t="cancel">取消</button><button type="submit" class="primary" data-t="save">保存</button></div></form></dialog>
</body></html>
